name: Yahoo Auction brand alert
on:
  schedule:
    - cron: "10,25,40,55 * * * *"  # mercari 워크플로우와 겹치지 않게 5분씩 밀어둠
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: yahoo-auction-alert
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx beautifulsoup4
      - name: Run Yahoo Auction checker
        timeout-minutes: 5
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python yahoo_auction_check.py
      - name: Commit updated yahoo_seen.json
        run: |
          git config user.name "yahoo-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/yahoo_seen.json
          git diff --cached --quiet || git commit -m "update yahoo seen items"
          # 메루카리 워크플로우 등 다른 작업이 같은 브랜치에 동시에 push할 수 있으므로,
          # 실패하면 최신 커밋을 받아와서(rebase) 몇 번 재시도한다.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공"
              break
            fi
            echo "push 실패, origin/main 기준으로 rebase 후 재시도 ($i/5)"
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
