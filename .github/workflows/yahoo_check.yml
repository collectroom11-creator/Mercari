name: Yahoo Auction brand alert
on:
  schedule:
    - cron: "10,25,40,55 * * * *"  # mercari 워크플로우와 겹치지 않게 5분씩 밀어둠
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: yahoo-auction-alert
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx beautifulsoup4
      - name: Run Yahoo Auction checker
        timeout-minutes: 5
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python yahoo_auction_check.py
      - name: Commit updated yahoo_seen.json
        run: |
          git config user.name "yahoo-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/yahoo_seen.json
          git diff --cached --quiet || git commit -m "update yahoo seen items"
          git push
