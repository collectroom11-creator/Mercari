name: Mercari brand alert

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행도 가능

# seen.json 커밋을 위해 쓰기 권한 필요
permissions:
  contents: write

concurrency:
  group: mercari-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest Mercari category/brand facets
        run: |
          set -e
          git clone --depth 1 https://github.com/take-kun/mercapi.git /tmp/mercapi-src
          cd /tmp/mercapi-src
          pip install .
          python utils/fetch_facets.py
          mkdir -p "$GITHUB_WORKSPACE/facets"
          # facets 관련 json 파일을 전부 찾아 작업 폴더로 복사 (정확한 파일명을 몰라도 되게)
          find . -iname "*.json" -not -path "*/.git/*" -print0 \
            | xargs -0 -I{} cp {} "$GITHUB_WORKSPACE/facets/"
          echo "복사된 facets 파일 목록:"
          ls -la "$GITHUB_WORKSPACE/facets/"

      - name: Run checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit updated seen.json
        run: |
          git config user.name "mercari-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "update seen items"
          git push
