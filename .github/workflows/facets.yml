name: Refresh Mercari facets
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: mercari-facets
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch latest Mercari category/brand facets
        timeout-minutes: 5
        run: |
          set -e
          git clone --depth 1 https://github.com/take-kun/mercapi.git /tmp/mercapi-src
          cd /tmp/mercapi-src
          pip install .
          python utils/fetch_facets.py
          mkdir -p "$GITHUB_WORKSPACE/facets"
          find . -iname "*.json" -not -path "*/.git/*" -print0 \
            | xargs -0 -I{} cp {} "$GITHUB_WORKSPACE/facets/"
          echo "복사된 facets 파일 목록:"
          ls -la "$GITHUB_WORKSPACE/facets/"
      - name: Commit updated facets
        run: |
          git config user.name "mercari-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add facets/
          git diff --cached --quiet || git commit -m "refresh facets"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공"
              break
            fi
            echo "push 실패, origin/main 기준으로 rebase 후 재시도 ($i/5)"
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
