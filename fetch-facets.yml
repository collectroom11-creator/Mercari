# 메루카리 카테고리/브랜드 ID(facets)를 하루 1회 갱신해서 리포에 커밋해두는 워크플로우.
# 15분마다 도는 check.yml은 여기서 커밋한 facets/ 폴더를 그냥 읽기만 하고,
# 매번 외부 저장소를 새로 clone/설치/실행하지 않는다.
# (facets는 자주 안 바뀌는 정보라 15분마다 재수집할 필요가 없고,
#  매번 재수집하면 실행 시간도 오래 걸리고 외부 저장소 상태 변화에도
#  더 자주 노출된다.)
name: Fetch Mercari facets

on:
  schedule:
    - cron: "0 18 * * *"  # 매일 1회 (UTC 18:00 = 한국시간 03:00)
  workflow_dispatch: {}  # 필요하면 Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

concurrency:
  group: mercari-facets
  cancel-in-progress: false  # facets 갱신은 겹쳐도 취소하지 말고 순서대로

jobs:
  fetch-facets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest Mercari category/brand facets
        timeout-minutes: 5
        run: |
          set -e
          git clone --depth 1 https://github.com/take-kun/mercapi.git /tmp/mercapi-src
          cd /tmp/mercapi-src
          pip install .
          python utils/fetch_facets.py
          mkdir -p "$GITHUB_WORKSPACE/facets"
          # facets 관련 json 파일을 전부 찾아 작업 폴더로 복사 (정확한 파일명을 몰라도 되게)
          find . -iname "*.json" -not -path "*/.git/*" -print0 \
            | xargs -0 -I{} cp {} "$GITHUB_WORKSPACE/facets/"
          echo "복사된 facets 파일 목록:"
          ls -la "$GITHUB_WORKSPACE/facets/"

      - name: Commit updated facets
        run: |
          git config user.name "mercari-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add facets/
          git diff --cached --quiet || git commit -m "update mercari facets (daily)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공"
              break
            fi
            echo "push 실패, origin/main 기준으로 rebase 후 재시도 ($i/5)"
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
