<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>재고 관리</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">재고 가계부</div>
    <div class="topbar-right">
      <div id="fxRateChip" class="fx-rate-chip" hidden></div>
      <button id="loginBtn" class="btn-ghost">켄즈포스트 로그인</button>
    </div>
  </header>

  <section id="tab-list" class="panel active">
    <div id="overviewBody" class="dashboard-row"></div>

    <div class="card add-card">
      <div class="add-row">
        <input id="urlInput" placeholder="켄즈포스트 상품 링크를 붙여넣으세요" disabled>
        <button id="fetchBtn" class="btn-primary" disabled>추가</button>
        <button id="manualAddBtn" class="btn-ghost">수동으로 추가</button>
      </div>
      <p id="fetchResult" class="hint"></p>

      <form id="saveForm" class="manual-form" hidden>
        <div class="field-grid">
          <label>상품명<input id="titleField"></label>
          <label>엔화가격<input id="jpyField" type="number"></label>
          <label>환율(100엔)<input id="fxField" type="number"></label>
          <label>원가(원)<input id="costField" type="number" disabled></label>
          <label>판매가(원)<input id="targetField" type="number"></label>
          <label>
            사진
            <input id="manualImageField" type="file" accept="image/*">
            <img id="manualImagePreview" class="manual-image-preview" hidden>
          </label>
        </div>
        <button type="submit" class="btn-primary">재고로 추가</button>
      </form>
    </div>

    <div class="list-toolbar">
      <select id="statusFilter">
        <option value="">전체</option>
        <option value="배송전">배송전</option>
        <option value="업로드전">업로드전</option>
        <option value="판매중">판매중</option>
        <option value="판매완료">판매완료</option>
      </select>

      <div class="toolbar-right">
        <div class="bulk-discount">
          <span id="selectedCount" class="hint-inline">0개 선택됨</span>
          <button id="discount5Btn" class="btn-ghost btn-sm" disabled>5% 할인</button>
          <button id="discount10Btn" class="btn-ghost btn-sm" disabled>10% 할인</button>
          <button id="discount20Btn" class="btn-ghost btn-sm" disabled>20% 할인</button>
        </div>
        <button id="monthlyViewBtn" class="btn-ghost btn-sm">월별 정리</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="item-table">
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" id="selectAllCheckbox"></th>
            <th class="col-thumb"></th>
            <th class="col-title">상품명</th>
            <th class="col-num">원가</th>
            <th class="col-num">현지배송비</th>
            <th class="col-num">판매가</th>
            <th class="col-num">마진율</th>
            <th>상태</th>
            <th>업로드일</th>
            <th class="col-actions">판매 처리</th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="itemTableBody"></tbody>
      </table>
    </div>
  </section>

  <div id="monthlyModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">월별 정리</div>
        <button id="closeMonthlyModal" class="btn-ghost btn-sm">닫기</button>
      </div>
      <div class="table-wrap">
        <table class="item-table">
          <thead>
            <tr>
              <th>월</th>
              <th class="col-num">순이익</th>
              <th class="col-num">매출</th>
              <th class="col-num">매출원가</th>
            </tr>
          </thead>
          <tbody id="monthlyTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
