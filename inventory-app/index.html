<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>재고 관리</title>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">COLLECTROOM</div>
      <div class="view-tabs">
        <button class="view-tab active" data-view="inventory">재고관리</button>
        <button class="view-tab" data-view="ledger">가계부</button>
      </div>
    </div>
    <div class="topbar-right">
      <div id="fxRateChip" class="fx-rate-chip" hidden></div>
    </div>
  </header>

  <div id="view-inventory" class="app-shell">
  <nav class="side-nav">
    <button class="side-link active" data-page="page-dashboard">대시보드</button>
    <button class="side-link" data-page="tab-list">재고 입력</button>
    <button class="side-link" data-page="page-wishlist">찜 목록</button>
    <button class="side-link" data-page="page-filters">메루카리 필터</button>
    <div class="side-spacer"></div>
    <button id="alertsBtn" class="alerts-btn">🔔 알림 <span id="alertsBadge" class="alerts-badge" hidden>0</span></button>
  </nav>

  <main class="side-main">
  <section id="page-dashboard" class="page active">
    <div id="statCards" class="stat-grid"></div>
    <div class="chart-grid">
      <div class="card chart-card">
        <div class="chart-title">월별 매출</div>
        <div id="revenueChart" class="line-chart"></div>
      </div>
      <div class="card chart-card">
        <div class="chart-title">월별 순이익</div>
        <div id="profitChart" class="line-chart"></div>
      </div>
    </div>
  </section>

  <section id="page-wishlist" class="page"></section>
  <section id="page-filters" class="page"></section>

  <section id="tab-list" class="page panel">
    <div class="card add-card">
      <div class="add-row">
        <input id="urlInput" placeholder="켄즈포스트 상품 링크를 붙여넣으세요">
        <button id="fetchBtn" class="btn-primary">추가</button>
        <button id="manualAddBtn" class="btn-ghost">수동으로 추가</button>
      </div>
      <p id="fetchResult" class="hint"></p>

      <form id="saveForm" class="manual-form" hidden>
        <div class="field-grid">
          <label>상품명<input id="titleField"></label>
          <label>엔화가격<input id="jpyField" type="number"></label>
          <label>환율(100엔)<input id="fxField" type="number"></label>
          <label>원가(원)<input id="costField" type="number" disabled></label>
          <label>판매가(원)<input id="targetField" type="number"></label>
          <label>
            사진
            <input id="manualImageField" type="file" accept="image/*">
            <img id="manualImagePreview" class="manual-image-preview" hidden>
          </label>
        </div>
        <button type="submit" class="btn-primary">재고로 추가</button>
      </form>
    </div>

    <div class="list-toolbar">
      <div class="toolbar-right">
        <button id="monthlyViewBtn" class="btn-ghost btn-sm">월별 정리</button>
      </div>
    </div>

    <div id="kanban" class="kanban"></div>
  </section>
  </main>

  <div id="alertsPopup" class="alerts-popup" hidden></div>
  </div>

  <div id="view-ledger" class="ledger-view" hidden>
    <div class="ledger-toolbar">
      <span id="ledgerImportResult" class="hint-inline"></span>
      <button id="ledgerImportBtn" class="btn-ghost btn-sm">백업 불러오기</button>
    </div>
    <iframe id="ledgerFrame" class="ledger-frame" src="ledger/ledger.html"></iframe>
  </div>

  <div id="monthlyModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">월별 정리</div>
        <button id="closeMonthlyModal" class="btn-ghost btn-sm">닫기</button>
      </div>
      <div class="table-wrap">
        <table class="item-table">
          <thead>
            <tr>
              <th>월</th>
              <th class="col-num">순이익</th>
              <th class="col-num">매출</th>
              <th class="col-num">매출원가</th>
            </tr>
          </thead>
          <tbody id="monthlyTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="shop.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
