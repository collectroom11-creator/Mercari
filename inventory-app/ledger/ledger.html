<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가계부</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css');

  :root{
    --bg: #F2F4F6;
    --card: #FFFFFF;
    --text: #191F28;
    --text-soft: #8B95A1;
    --line: #F2F4F6;
    --blue: #3182F6;
    --blue-soft: #EAF2FF;
    --red: #F0616B;
    --green: #3182F6;
    --fill-soft: #F2F4F6;
    --fill-hover: #E5E8EB;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    min-height: 100vh;
  }

  .material-icons{ vertical-align: middle; line-height: 1; }

  .app{
    display:grid;
    grid-template-columns: 300px 1fr 380px;
    gap: 20px;
    max-width: 1440px;
    margin: 0 auto;
    padding: 28px 20px;
    align-items: start;
  }

  /* ---- Left: 기록 / 카테고리 ---- */
  .col-left{
    position: relative;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(25,31,40,0.04), 0 1px 8px rgba(25,31,40,0.04);
    padding: 32px 28px;
    max-height: calc(100vh - 56px);
    display: flex;
    flex-direction: column;
  }
  .col-title{
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 20px;
  }

  .left-tabs{
    display:flex; gap:4px; margin-bottom: 20px;
    background: var(--fill-soft); border-radius: 12px; padding: 4px;
  }
  .left-tab-btn{
    flex:1; background:none; border:none; border-radius: 9px;
    padding: 9px 4px; font-size: 13px; color: var(--text-soft); cursor:pointer;
    font-family: 'Pretendard', sans-serif; font-weight: 500;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .left-tab-btn.active{
    color: var(--text); font-weight:700; background: var(--card);
    box-shadow: 0 1px 2px rgba(25,31,40,0.08);
  }
  .left-panel{ display:none; min-height: 0; }
  .left-panel.active{ display:flex; flex-direction:column; min-height: 0; flex: 1; }

  .type-toggle{
    display:flex; gap: 4px; margin-bottom: 16px;
    background: var(--fill-soft); border-radius: 12px; padding: 4px;
  }
  .type-toggle button{
    flex:1; border:none; background:none; border-radius: 9px;
    padding: 10px 14px; font-size: 14px; cursor:pointer;
    color: var(--text-soft); font-weight:500;
    font-family: 'Pretendard', sans-serif;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .type-toggle button.active.expense{
    color: var(--red); font-weight:700; background: var(--card);
    box-shadow: 0 1px 2px rgba(25,31,40,0.08);
  }
  .type-toggle button.active.income{
    color: var(--green); font-weight:700; background: var(--card);
    box-shadow: 0 1px 2px rgba(25,31,40,0.08);
  }
  .type-toggle button.active:not(.expense):not(.income){
    color: var(--text); font-weight:700; background: var(--card);
    box-shadow: 0 1px 2px rgba(25,31,40,0.08);
  }

  .date-simple{ position: relative; }
  .date-picker-btn{
    width:100%;
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    padding: 13px 15px;
    border: none;
    background: var(--fill-soft);
    border-radius: 12px;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    display:flex; align-items:center; justify-content:space-between;
  }
  .date-picker-btn:hover{ background: var(--fill-hover); }
  .date-picker-btn .material-icons{ font-size: 18px; color: var(--text-soft); }

  .date-popover{
    position:absolute;
    top: calc(100% + 8px);
    left: 0; right: 0;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(25,31,40,0.10);
    padding: 16px;
    z-index: 40;
    display:none;
  }
  .date-popover.open{ display:block; }
  .fd-cal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px;
  }
  .fd-cal-head button{
    background:none; border:none; color: var(--text-soft); cursor:pointer; font-size:12px; padding:4px 6px;
  }
  .fd-cal-head button:hover{ color: var(--text); }
  .fd-cal-head .fd-cal-label{ font-size: 14px; font-weight: 700; color: var(--text); }
  .fd-cal-grid{
    display:grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align:center;
  }
  .fd-cal-dow{ font-size: 11px; color: var(--text-soft); font-weight:600; padding-bottom: 6px; }
  .fd-cal-day{
    font-size: 13px; padding: 9px 0; border-radius: 10px; cursor:pointer; font-weight:500; color: var(--text);
  }
  .fd-cal-day:hover{ background: var(--fill-soft); }
  .fd-cal-day.muted{ color: var(--text-soft); opacity:0.35; }
  .fd-cal-day.today:not(.selected){ color: var(--blue); font-weight:700; }
  .fd-cal-day.selected{ background: var(--blue); color:#fff; font-weight:700; }

  .entry-form .row{
    display:flex;
    gap: 8px;
    margin-bottom: 10px;
    position: relative;
  }
  .entry-form input, .entry-form select{
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    padding: 13px 15px;
    border: none;
    background: var(--fill-soft);
    border-radius: 12px;
    color: var(--text);
    width: 100%;
    transition: box-shadow .15s, background .15s;
  }
  .entry-form input:focus, .entry-form select:focus{
    outline:none;
    background: var(--card);
    box-shadow: 0 0 0 2px var(--blue);
  }

  .desc-field{ position: relative; flex: 1 1 auto; }
  .desc-field input{ width: 100%; }

  .autocomplete{
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(25,31,40,0.10);
    z-index: 30;
    overflow: hidden;
    display: none;
  }
  .autocomplete.open{ display: block; }
  .autocomplete .ac-label{ font-size: 11px; color: var(--text-soft); letter-spacing: 0.5px; padding: 10px 14px 4px; font-weight:600; }
  .autocomplete .ac-item{
    padding: 10px 14px; font-size: 13px; cursor: pointer;
    display:flex; justify-content: space-between; align-items:center; gap: 8px;
  }
  .autocomplete .ac-item:hover{ background: var(--fill-soft); }
  .autocomplete .ac-item .ac-cat{ font-size: 11px; color: var(--text-soft); flex-shrink:0; }

  .row.cat-amt{ align-items: stretch; }
  .cat-select{ flex: 4 1 0; font-size: 13px; color: var(--text-soft); cursor: pointer; font-weight:500; }
  #fCategory{
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    padding-right: 30px;
    background-image: url('data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%226%22 viewBox=%220 0 10 6%22%3E%3Cpath d=%22M0 0L5 6L10 0Z%22 fill=%22%238B95A1%22/%3E%3C/svg%3E');
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 9px 5px;
  }
  .amount-field{ flex: 6 1 0; }
  .amount-field input{ width:100%; text-align:left; }
  .entry-form input[type=number]::-webkit-outer-spin-button,
  .entry-form input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance: none;
    margin: 0;
  }
  .entry-form input[type=number]{
    -moz-appearance: textfield;
    appearance: textfield;
  }

  .final-row{ align-items: center; justify-content: space-between; margin-top: 4px; }
  .final-row.solo{ justify-content: flex-end; }
  .proof-toggle{ display:flex; align-items:center; gap: 10px; cursor:pointer; }
  .proof-toggle.compact{ gap: 8px; }
  .proof-toggle-label{ font-size:13px; color:var(--text-soft); font-weight:600; }
  .switch{ position:relative; display:inline-block; width:42px; height:24px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch-slider{
    position:absolute; cursor:pointer; top:0;left:0;right:0;bottom:0;
    background: var(--fill-hover); transition:.2s; border-radius:999px;
  }
  .switch-slider:before{
    content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px;
    background:#fff; transition:.2s; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .switch input:checked + .switch-slider{ background: var(--blue); }
  .switch input:checked + .switch-slider:before{ transform: translateX(18px); }

  .proof-badge{
    display:inline-block; margin-left:6px; font-size:10px; font-weight:700;
    color: var(--blue); background: var(--blue-soft); padding:2px 6px; border-radius:999px; vertical-align:middle;
  }

  .submit-circle{
    flex: 0 0 48px;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--blue);
    color: #fff;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    padding: 0;
    box-shadow: 0 2px 8px rgba(49,130,246,0.22);
    transition: transform .1s, opacity .15s;
  }
  .submit-circle .material-icons{ font-size: 22px; }
  .submit-circle:hover{ opacity:0.9; transform: translateY(-1px); }

  /* 카테고리 관리 패널 */
  #leftPanelCategory{ }
  #categoryEditList{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #categoryEditList::-webkit-scrollbar{ display: none; }
  .cat-edit-block{ margin-bottom: 20px; }
  .cat-edit-title{
    font-size: 14px; font-weight:700; margin-bottom: 10px;
    display:flex; align-items:center; justify-content:space-between; gap: 8px;
  }
  .cat-del-btn{
    border:none; background:none; cursor:pointer; color: var(--text-soft);
    display:flex; align-items:center; overflow:hidden;
    width: 0; opacity: 0;
    transition: width .15s ease, opacity .15s ease;
  }
  .cat-edit-block:hover .cat-del-btn{ width: 18px; opacity: 0.7; }
  .cat-del-btn:hover{ opacity:1 !important; color: var(--red); }
  .cat-edit-keywords{
    display:flex; flex-wrap:wrap; gap: 7px; align-items:center;
  }
  .kw-chip{
    display:inline-flex; align-items:center;
    background: var(--blue-soft); color: var(--blue);
    font-size: 12px; font-weight:600; padding: 6px 12px;
    border-radius: 999px;
  }
  .kw-chip .kw-del{
    display:inline-block;
    border:none; background:none; cursor:pointer; color: var(--blue);
    font-size:10px; padding:0; white-space:nowrap; overflow:hidden;
    width: 0; margin-left: 0; opacity: 0;
    transition: width .15s ease, margin-left .15s ease, opacity .15s ease;
  }
  .kw-chip:hover .kw-del{ width: 10px; margin-left: 6px; opacity: 1; }
  .kw-add-input{
    border:none;
    background: var(--fill-soft); border-radius: 999px;
    font-size: 12px; padding: 7px 14px;
    width: 110px; font-family: 'Pretendard', sans-serif; color: var(--text);
  }
  .kw-add-input:focus{ outline:none; box-shadow: 0 0 0 2px var(--blue); }

  .fab-add{
    position: absolute;
    bottom: 24px;
    right: 24px;
    width:48px; height:48px; border-radius:50%;
    background: rgba(49,130,246,0.6); color:#fff; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 10px rgba(25,31,40,0.12);
    backdrop-filter: blur(2px);
    transition: transform .1s, background .15s;
  }
  .fab-add .material-icons{ font-size:24px; }
  .fab-add:hover{ background: rgba(49,130,246,0.8); transform: translateY(-1px); }

  .cat-add-row{ margin-top: 6px; margin-bottom: 60px; }
  .cat-add-row input{
    width:100%; border:none; background: var(--fill-soft); border-radius: 12px;
    padding:13px 15px; font-size:13px; font-family:'Pretendard', sans-serif; color: var(--text);
  }
  .cat-add-row input:focus{ outline:none; box-shadow: 0 0 0 2px var(--blue); }

  /* 뷰 전환 탭 (주간/월간) */
  .view-tabs{
    display:flex; gap:4px; margin-bottom: 24px;
    background: var(--fill-soft); border-radius: 12px; padding: 4px;
  }
  .view-tab-btn{
    flex:1; background:none; border:none; border-radius: 9px;
    padding: 10px 4px; font-size: 13px; color: var(--text-soft); cursor:pointer;
    font-family: 'Pretendard', sans-serif; font-weight:500;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .view-tab-btn.active{
    color: var(--text); font-weight:700; background: var(--card);
    box-shadow: 0 1px 2px rgba(25,31,40,0.08);
  }
  .view-panel{ display:none; min-height: 0; }
  .view-panel.active{ display:flex; flex-direction:column; min-height: 0; flex: 1; }

  .breakdown{ margin-bottom: 28px; }
  .breakdown h2{ font-size: 13px; color: var(--text); margin: 0 0 16px; font-weight: 700; }
  .bd-row{ display:flex; align-items:center; gap: 10px; margin-bottom: 12px; font-size: 12px; }
  .bd-row .bd-label{ width: 74px; flex-shrink:0; color: var(--text-soft); font-weight:500; }
  .bd-bar-bg{ flex:1; background: var(--fill-soft); border-radius: 4px; height: 8px; overflow:hidden; }
  .bd-bar{ height:100%; background: var(--blue); border-radius: 4px; }
  .bd-amt{ width: 90px; text-align:right; font-size: 12px; font-weight: 700; color: var(--text); flex-shrink:0; }

  /* ---- 3번째 컬럼: 월별 가계부 ---- */
  .col-monthly{
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(25,31,40,0.04), 0 1px 8px rgba(25,31,40,0.04);
    padding: 32px 28px;
    max-height: calc(100vh - 56px);
    display: flex;
    flex-direction: column;
  }
  .mo-legend{ display:flex; gap: 16px; margin-bottom: 16px; }
  .col-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 20px; }
  .col-title-row .col-title{ margin-bottom: 0; }
  .mo-all-btn{
    font-size: 12px; font-weight: 700; color: var(--blue);
    background: var(--blue-soft); border:none; padding: 7px 14px;
    border-radius: 999px; cursor:pointer;
  }
  .mo-all-btn:hover{ background: var(--blue); color:#fff; }
  .mo-legend-item{ display:flex; align-items:center; gap: 6px; font-size: 12px; color: var(--text-soft); font-weight:600; }
  .mo-legend-dot{ width: 8px; height: 8px; border-radius: 50%; }
  .mo-legend-dot.expense{ background: var(--red); }
  .mo-legend-dot.income{ background: var(--green); }
  .mo-chart{ overflow-x: auto; overflow-y: hidden; margin-bottom: 28px; cursor: grab; scrollbar-width: none; -ms-overflow-style: none; flex-shrink: 0; }
  .mo-chart:active{ cursor: grabbing; }
  .mo-chart svg{ display:block; user-select: none; }
  .mo-chart::-webkit-scrollbar{ display:none; }

  #moMonthList{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #moMonthList::-webkit-scrollbar{ display: none; }
  .mo-month-row{
    padding: 16px 12px;
    margin: 0 -12px;
    border-top: 1px solid var(--fill-hover);
  }
  .mo-month-row:first-child{ border-top: none; }
  .mo-month-label{ font-size: 15px; font-weight: 800; }
  .mo-stat-line{
    display:flex; align-items:center; justify-content:space-between;
    font-size: 13px; padding: 3px 0;
  }
  .mo-stat-line .mo-stat-label{ color: var(--text-soft); font-weight:500; }
  .mo-stat-line .mo-stat-value{ font-weight: 700; }
  .mo-stat-line.expense .mo-stat-value{ color: var(--red); }
  .mo-stat-line.income .mo-stat-value{ color: var(--green); }
  .mo-stat-line.net .mo-stat-value{ font-weight: 800; }
  .mo-stat-line.net .mo-stat-value.pos{ color: var(--blue); }
  .mo-stat-line.net .mo-stat-value.neg{ color: var(--red); }

  /* ---- Right: 내역 ---- */
  .col-right{
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(25,31,40,0.04), 0 1px 8px rgba(25,31,40,0.04);
    padding: 32px 28px;
    max-height: calc(100vh - 56px);
    display: flex;
    flex-direction: column;
  }

  .month-nav{ display:flex; align-items:center; justify-content:center; gap: 16px; margin-bottom: 20px; }
  .month-nav button{
    background:none; border:none; color: var(--text-soft); cursor:pointer;
    font-size:11px; padding: 4px 6px;
  }
  .month-nav button:hover{ color: var(--text); }
  .month-nav .m-label{
    font-size: 17px; font-weight: 800;
    color: var(--text); min-width: 150px; text-align:center;
  }
  .week-nav{ margin-top: 4px; margin-bottom: 16px; gap: 24px; }
  #cvGrid{ cursor: grab; touch-action: pan-y; user-select: none; }
  #cvGrid:active{ cursor: grabbing; }
  .month-nav button:disabled{ opacity: 0.25; cursor: default; }
  .month-nav button:disabled:hover{ color: var(--text-soft); }
  .cv-cell.out-of-month{ cursor: default; pointer-events: none; opacity: 0.25; }

  .summary{
    display:flex; background: var(--fill-soft); border-radius: 18px;
    padding: 22px 20px; margin-bottom: 28px; gap: 8px;
  }
  .sum-item{ text-align:center; flex:1; }
  .sum-item .label{ font-size: 12px; color: var(--text-soft); font-weight:600; margin-bottom: 8px; }
  .sum-item .value{ font-size: 20px; font-weight: 800; }
  .sum-item.income .value{ color: var(--green); }
  .sum-item.expense .value{ color: var(--red); }
  .sum-item.balance .value{ color: var(--text); }

  /* 주간 달력 */
  .cv-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 2px;
    flex-shrink: 0;
  }
  .cv-dow{ font-size: 12px; color: var(--text-soft); text-align:center; padding-bottom: 10px; font-weight:600; }
  .cv-cell{
    background: none;
    border-radius: 12px;
    padding: 4px 2px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 6px;
    cursor: pointer;
  }
  .cv-daynum-wrap{
    width: 36px; height: 36px;
    display:flex; align-items:center; justify-content:center;
    border-radius: 50%;
    transition: background .15s;
  }
  .cv-cell:hover .cv-daynum-wrap{ background: var(--fill-soft); }
  .cv-cell.today .cv-daynum-wrap{ background: var(--fill-soft); }
  .cv-daynum{
    font-size: 20px;
    color: var(--text-soft);
    font-weight: 600;
  }
  .cv-daynum.has-data{ color: var(--text); font-weight: 800; }
  .wk-totals{ display:flex; flex-direction:column; align-items:center; gap: 2px; min-height: 32px; }
  .wk-line{ font-size: 11px; font-weight: 700; white-space:nowrap; }
  .wk-line.expense{ color: var(--red); }
  .wk-line.income{ color: var(--green); }

  /* 내역 목록 */
  .ledger{
    margin-bottom: 8px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .ledger::-webkit-scrollbar{ display: none; }
  .day-group-header{
    font-size: 13px; color: var(--text-soft); font-weight: 500;
    margin: 20px 4px 8px;
  }
  .day-group-header:first-child{ margin-top: 4px; }
  .ledger-row{
    display:flex; align-items:center; justify-content:space-between; gap: 10px; padding: 12px 4px;
    border-radius: 12px; font-size: 13px;
    transition: background .15s;
  }
  .ledger-main{ display:flex; flex-direction:column; gap: 3px; min-width:0; }
  .ledger-amt{ font-size: 16px; font-weight: 800; }
  .ledger-row.expense .ledger-amt{ color: var(--red); }
  .ledger-row.income .ledger-amt{ color: var(--green); }
  .ledger-desc{
    font-size: 13px; color: var(--text-soft); font-weight: 700;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .ledger-side{ display:flex; align-items:center; gap: 8px; flex-shrink:0; }
  .ledger-row .cat-select{
    border:none; background:none; color: var(--text-soft); font-size: 11px; padding: 0; cursor:pointer; max-width: 74px;
  }
  .ledger-row .del{
    background:none; border:none; cursor:pointer; color: var(--text-soft); font-size: 18px; font-weight:700;
  }
  .ledger-row .del:hover{ color: var(--red); }

  .empty{ padding: 40px 0; text-align:center; color: var(--text-soft); font-size: 13px; line-height: 1.7; }

  .loading{ text-align:center; color: var(--text-soft); font-size: 12px; padding: 16px; }

  /* 월별 상세 모달 */
  .mo-month-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
  .mo-detail-btn{
    background:none; border:none; color: var(--text-soft); cursor:pointer;
    display:flex; align-items:center; padding: 2px;
  }
  .mo-detail-btn:hover{ color: var(--blue); }
  .mo-detail-btn .material-icons{ font-size: 20px; }

  .modal-overlay{
    position: fixed; inset: 0; background: rgba(25,31,40,0.45);

<script>
// Claude.ai 안에서는 window.storage(클라우드 저장)를 그대로 쓰고,
// 로컬 파일로 더블클릭해서 열었을 때는 브라우저의 localStorage를 대신 사용해요.
// 그래야 데스크탑에서 인터넷/Claude.ai 없이도 그대로 저장이 돼요.
const storage = (typeof window !== "undefined" && window.storage) ? window.storage : {
  async get(key){
    const raw = localStorage.getItem(key);
    if (raw === null) return null;
    return { key, value: raw };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value };
  }
};
let CATEGORIES = { expense: [], income: [] };
let CATEGORY_KEYWORDS = { expense: {}, income: {} };

function normalizeCategoryData(){
  if (!CATEGORIES.expense) CATEGORIES.expense = [];
  if (!CATEGORIES.income) CATEGORIES.income = [];
  if (!CATEGORY_KEYWORDS.expense) CATEGORY_KEYWORDS.expense = {};
  if (!CATEGORY_KEYWORDS.income) CATEGORY_KEYWORDS.income = {};
}

function categorize(desc, type){
  const text = (desc || "").toLowerCase();
  const cats = CATEGORIES[type] || [];
  for (const cat of cats){
    const words = (CATEGORY_KEYWORDS[type] && CATEGORY_KEYWORDS[type][cat]) || [];
    if (words.some(w => text.includes(w.toLowerCase()))){
      return cat;
    }
  }
  return "미분류";
}

let currentType = "expense";
let transactions = [];
let recentDesc = { expense: [], income: [] };
let loaded = false;
let categoryManuallySet = false;
let activeCatEditType = "expense";

function startOfWeek(d){
  const nd = new Date(d);
  nd.setHours(0,0,0,0);
  nd.setDate(nd.getDate() - nd.getDay());
  return nd;
}
let currentWeekStart = startOfWeek(new Date());
let summaryMonthDate = new Date();
let modalScope = "month"; // "month" | "all"
let modalMonthKey = null;
let modalTypeFilter = "all";
let modalCategorySelected = new Set();
let modalProofFilter = "all";
let modalDateFrom = null;
let modalDateTo = null;
let modalFromDate = null;
let modalToDate = null;
let modalFromCalView = new Date();
let modalToCalView = new Date();
let formDate = new Date();
let fdCalViewDate = new Date();

const $ = (id) => document.getElementById(id);

function fmtWon(n){ return (n < 0 ? "-" : "") + Math.abs(Math.round(n)).toLocaleString("ko-KR") + "원"; }
function toISO(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function monthLabelText(d){ return d.getFullYear() + "년 " + (d.getMonth()+1) + "월"; }
function fmtFormDate(d){
  const days = ["일","월","화","수","목","금","토"];
  return (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + days[d.getDay()] + ")";
}
function renderDateDisplay(){
  $("dateDisplayText").textContent = fmtFormDate(formDate);
}
function renderFormCalendar(){
  $("fdCalLabel").textContent = (fdCalViewDate.getMonth()+1) + "월";
  const grid = $("fdCalGrid");
  const dows = ["일","월","화","수","목","금","토"];
  let html = dows.map(d => `<div class="fd-cal-dow">${d}</div>`).join("");

  const year = fdCalViewDate.getFullYear();
  const month = fdCalViewDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const today = new Date();

  const cells = [];
  for (let i = startOffset - 1; i >= 0; i--){
    cells.push({ day: daysInPrevMonth - i, muted: true, date: new Date(year, month-1, daysInPrevMonth - i) });
  }
  for (let d = 1; d <= daysInMonth; d++){
    cells.push({ day: d, muted: false, date: new Date(year, month, d) });
  }
  while (cells.length % 7 !== 0){
    const nextDay = cells.length - (startOffset + daysInMonth) + 1;
    cells.push({ day: nextDay, muted: true, date: new Date(year, month+1, nextDay) });
  }

  html += cells.map(c => {
    const iso = toISO(c.date);
    const isToday = iso === toISO(today);
    const isSelected = iso === toISO(formDate);
    let cls = "fd-cal-day";
    if (c.muted) cls += " muted";
    if (isToday) cls += " today";
    if (isSelected) cls += " selected";
    return `<div class="${cls}" data-iso="${iso}">${c.day}</div>`;
  }).join("");

  grid.innerHTML = html;
  grid.querySelectorAll(".fd-cal-day").forEach(el => {
    el.addEventListener("click", () => {
      const [y,m,d] = el.dataset.iso.split("-").map(Number);
      formDate = new Date(y, m-1, d);
      renderDateDisplay();
      closeFormCalendar();
    });
  });
}
function openFormCalendar(){
  fdCalViewDate = new Date(formDate);
  renderFormCalendar();
  $("datePopover").classList.add("open");
}
function closeFormCalendar(){
  $("datePopover").classList.remove("open");
}
function currentMonthTx(){
  const key = monthKey(summaryMonthDate);
  return transactions.filter(t => t.date.slice(0,7) === key);
}
function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str){ return escapeHtml(str).replace(/"/g, "&quot;"); }

function weekDates(start){
  return Array.from({length:7}, (_, i) => {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    return d;
  });
}
function weekLabelText(start){
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  const fmt = d => (d.getMonth()+1) + "월 " + d.getDate() + "일";
  if (start.getFullYear() === end.getFullYear() && start.getMonth() === end.getMonth()){
    return fmt(start) + " - " + end.getDate() + "일";
  }
  return fmt(start) + " - " + fmt(end);
}

function populateCategorySelect(){
  const sel = $("fCategory");
  const cats = CATEGORIES[currentType] || [];
  const opts = cats.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join("");
  sel.innerHTML = opts + `<option value="미분류">미분류</option>`;
}

function setType(type){
  currentType = type;
  categoryManuallySet = false;
  $("btnExpense").classList.toggle("active", type==="expense");
  $("btnIncome").classList.toggle("active", type==="income");
  populateCategorySelect();
  $("fCategory").value = categorize($("fDesc").value, currentType);
  if (document.activeElement === $("fDesc")) renderAutocomplete();

  const proofToggle = document.querySelector(".proof-toggle.compact");
  const finalRow = proofToggle ? proofToggle.closest(".final-row") : null;
  if (type === "income"){
    if (proofToggle) proofToggle.style.display = "none";
    if (finalRow) finalRow.classList.add("solo");
    $("fProof").checked = false;
  } else {
    if (proofToggle) proofToggle.style.display = "flex";
    if (finalRow) finalRow.classList.remove("solo");
  }
}

      // 이전 버전(지출/수입 구분 없던 형식) 호환
      recentDesc = { expense: parsed, income: [] };
    } else {
      recentDesc = { expense: (parsed && parsed.expense) || [], income: (parsed && parsed.income) || [] };
    }
  }catch(e){ recentDesc = { expense: [], income: [] }; }
  try{
    const res3 = await storage.get("ledger:categories");
    CATEGORIES = res3 ? JSON.parse(res3.value) : { expense: [], income: [] };
  }catch(e){ CATEGORIES = { expense: [], income: [] }; }
  try{
    const res4 = await storage.get("ledger:categoryKeywords");
    CATEGORY_KEYWORDS = res4 ? JSON.parse(res4.value) : { expense: {}, income: {} };
  }catch(e){ CATEGORY_KEYWORDS = { expense: {}, income: {} }; }
  normalizeCategoryData();
  await seedDaepyojaCategoryIfNeeded();
  populateCategorySelect();
  $("fCategory").value = categorize("", currentType);
  loaded = true;
  render();
}

function weekBoundStatus(){

  const monthEnd = new Date(summaryMonthDate.getFullYear(), summaryMonthDate.getMonth()+1, 0);
  const weekEnd = new Date(currentWeekStart); weekEnd.setDate(weekEnd.getDate()+6);
  const monthStartISO = toISO(monthStart), monthEndISO = toISO(monthEnd);
  const weekStartISO = toISO(currentWeekStart), weekEndISO = toISO(weekEnd);
  const blockPrev = (monthStartISO >= weekStartISO && monthStartISO <= weekEndISO);
  const blockNext = (monthEndISO >= weekStartISO && monthEndISO <= weekEndISO);
  return { blockPrev, blockNext };
}

function computeAllMonthlyTotals(){
  const map = {};
  transactions.forEach(t => {
    const key = t.date.slice(0,7);
    if (!map[key]) map[key] = { income: 0, expense: 0 };
    if (t.type === "income") map[key].income += t.amount;
    else map[key].expense += t.amount;
  });
  return Object.keys(map).sort().map(key => ({
    key,
    income: map[key].income,
    expense: map[key].expense,
    net: map[key].income - map[key].expense
  }));
}

function toKoreanShort(n){
  if (n >= 10000){
    const man = n / 10000;
    const rounded = man >= 100 ? Math.round(man) : Math.round(man * 10) / 10;
    return rounded + "만";
  }
  return n.toLocaleString("ko-KR");
}

function renderMonthlyChart(data){
  const container = $("moChart");
  if (data.length === 0){
    container.innerHTML = "";
    return;
  }
  const groupW = 84;
  const barW = 22;
  const chartH = 154;
  const labelPad = 20;
  const padBottom = 22;
  const svgW = Math.max(data.length * groupW, 240);
  const svgH = chartH + padBottom;
  const maxVal = Math.max(1, ...data.map(d => Math.max(d.income, d.expense)));
  const usableH = chartH - labelPad - 8;

  let bars = "";
  data.forEach((d, i) => {
    const gx = i * groupW + (groupW - (barW*2 + 4)) / 2;
    const expH = (d.expense / maxVal) * usableH;
    const incH = (d.income / maxVal) * usableH;
    const expY = chartH - expH;
    const incY = chartH - incH;

    if (d.expense > 0){
      bars += `<text x="${gx + barW/2}" y="${expY - 4}" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--red)" font-family="Pretendard, sans-serif">${toKoreanShort(d.expense)}</text>`;
    }
    bars += `<rect x="${gx}" y="${expY}" width="${barW}" height="${Math.max(expH,1)}" rx="3" style="fill:var(--red)"></rect>`;

    if (d.income > 0){
      bars += `<text x="${gx + barW + 4 + barW/2}" y="${incY - 4}" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--green)" font-family="Pretendard, sans-serif">${toKoreanShort(d.income)}</text>`;
    }
    bars += `<rect x="${gx + barW + 4}" y="${incY}" width="${barW}" height="${Math.max(incH,1)}" rx="3" style="fill:var(--green)"></rect>`;

    bars += `<text x="${gx + barW + 2}" y="${chartH + 16}" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--text-soft)" font-family="Pretendard, sans-serif">${Number(d.key.slice(5))}월</text>`;
  });

  container.innerHTML = `<svg viewBox="0 0 ${svgW} ${svgH}" width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
}

function buildRangeCalGrid(viewDate, selectedDate){
  const dows = ["일","월","화","수","목","금","토"];
  let html = dows.map(d => `<div class="fd-cal-dow">${d}</div>`).join("");

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const today = new Date();

  const cells = [];
  for (let i = startOffset - 1; i >= 0; i--){
    cells.push({ day: daysInPrevMonth - i, muted: true, date: new Date(year, month-1, daysInPrevMonth - i) });
  }
  for (let d = 1; d <= daysInMonth; d++){
    cells.push({ day: d, muted: false, date: new Date(year, month, d) });
  }
  while (cells.length % 7 !== 0){
    const nextDay = cells.length - (startOffset + daysInMonth) + 1;
    cells.push({ day: nextDay, muted: true, date: new Date(year, month+1, nextDay) });
  }

  html += cells.map(c => {
    const iso = toISO(c.date);
    const isToday = iso === toISO(today);
    const isSelected = selectedDate && iso === toISO(selectedDate);
    let cls = "fd-cal-day";
    if (c.muted) cls += " muted";
    if (isToday) cls += " today";
    if (isSelected) cls += " selected";
    return `<div class="${cls}" data-iso="${iso}">${c.day}</div>`;
  }).join("");

  return html;
}

/* ---------- 주간 달력 ---------- */
function renderWeekCalendar(list){
  const grid = $("cvGrid");
  const dows = ["일","월","화","수","목","금","토"];
  let html = dows.map(d => `<div class="cv-dow">${d}</div>`).join("");

  const byDay = {};
  list.forEach(t => {
    if (!byDay[t.date]) byDay[t.date] = { expense: 0, income: 0 };
    byDay[t.date][t.type] += t.amount;
  });

  const today = new Date();
  const dates = weekDates(currentWeekStart);

  html += dates.map(d => {
    const iso = toISO(d);
    const isToday = iso === toISO(today);
    const inMonth = d.getFullYear() === summaryMonthDate.getFullYear() && d.getMonth() === summaryMonthDate.getMonth();
    const totals = byDay[iso] || { expense: 0, income: 0 };
    const hasData = inMonth && (totals.expense > 0 || totals.income > 0);
    const lines = [];
    if (inMonth){
      if (totals.income > 0) lines.push(`<div class="wk-line income">+${totals.income.toLocaleString("ko-KR")}</div>`);
      if (totals.expense > 0) lines.push(`<div class="wk-line expense">-${totals.expense.toLocaleString("ko-KR")}</div>`);
    }
    return `<div class="cv-cell ${isToday?"today":""} ${inMonth?"":"out-of-month"}" data-iso="${iso}">
      <div class="cv-daynum-wrap"><span class="cv-daynum ${hasData?"has-data":""}">${d.getDate()}</span></div>
      <div class="wk-totals">${lines.join("")}</div>
    </div>`;
  }).join("");

  grid.innerHTML = html;


}

/* ---------- 내역 목록 ---------- */
function dayHeaderLabel(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  const dows = ["일","월","화","수","목","금","토"];
  return d + "일 " + dows[dt.getDay()] + "요일";
}

function renderLedgerList(list){
  const body = $("ledgerBody");
  if (!loaded){
    body.innerHTML = `<div class="loading">불러오는 중...</div>`;
  } else if (list.length === 0){
    body.innerHTML = `<div class="empty">이번 주 기록이 아직 없어요.</div>`;
  } else {
    const byDate = {};
    list.forEach(t => {
      if (!byDate[t.date]) byDate[t.date] = [];
      byDate[t.date].push(t);
    });
    const dateKeys = Object.keys(byDate).sort().reverse();

    body.innerHTML = dateKeys.map(dateKey => {
      const rows = byDate[dateKey].slice().reverse().map(t => {
        const catSet = Array.from(new Set([...(CATEGORIES[t.type] || []), "미분류", t.category].filter(Boolean)));
        const options = catSet.map(c => `<option value="${escapeAttr(c)}" ${c===t.category?"selected":""}>${escapeHtml(c)}</option>`).join("");
        return `
        <div class="ledger-row ${t.type}" data-id="${t.id}">
          <div class="ledger-main">
            <div class="ledger-amt">${t.type === "expense" ? "-" : "+"}${t.amount.toLocaleString("ko-KR")}원</div>
            <div class="ledger-desc">${escapeHtml(t.desc || "(내용 없음)")}${t.proof ? '<span class="proof-badge">증빙</span>' : ''}</div>
          </div>
          <div class="ledger-side">
            <select class="cat-select" data-id="${t.id}">${options}</select>
            <button class="del" data-id="${t.id}" title="삭제">✕</button>
          </div>
        </div>
      `;
      }).join("");
      return `<div class="day-group-header">${dayHeaderLabel(dateKey)}</div>${rows}`;
    }).join("");

    body.querySelectorAll(".del").forEach(btn => {
      btn.addEventListener("click", () => deleteTx(Number(btn.dataset.id)));
    });
    body.querySelectorAll("select.cat-select").forEach(sel => {
      sel.addEventListener("change", () => updateCategory(Number(sel.dataset.id), sel.value));
    });
  }
}

/* ---------- 카테고리 관리 ---------- */
function renderCategoryEditor(){
  const container = $("categoryEditList");
  const cats = CATEGORIES[activeCatEditType] || [];
  if (cats.length === 0){
    container.innerHTML = `<div class="empty" style="padding:24px 0;">현재 카테고리가 없습니다.</div>`;
    return;
  }
  container.innerHTML = cats.map(cat => {
    const words = (CATEGORY_KEYWORDS[activeCatEditType] && CATEGORY_KEYWORDS[activeCatEditType][cat]) || [];
    const chips = words.map(w => `
      <span class="kw-chip">${escapeHtml(w)}<button class="kw-del" data-cat="${escapeAttr(cat)}" data-word="${escapeAttr(w)}">✕</button></span>
    `).join("");
    return `<div class="cat-edit-block">
      <div class="cat-edit-title">
        <span>${escapeHtml(cat)}</span>
        <button type="button" class="cat-del-btn" data-cat="${escapeAttr(cat)}" title="카테고리 삭제">
          <span class="material-icons" style="font-size:16px;">close</span>
        </button>
      </div>
      <div class="cat-edit-keywords">
        ${chips}
        <input type="text" class="kw-add-input" placeholder="+ 키워드 추가" data-cat="${escapeAttr(cat)}">
      </div>
    </div>`;
  }).join("");

  container.querySelectorAll(".kw-del").forEach(btn => {
    btn.addEventListener("click", () => removeKeyword(activeCatEditType, btn.dataset.cat, btn.dataset.word));
  });
  container.querySelectorAll(".cat-del-btn").forEach(btn => {
    btn.addEventListener("click", () => deleteCategory(activeCatEditType, btn.dataset.cat));
  });
  container.querySelectorAll(".kw-add-input").forEach(inp => {
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter"){
        e.preventDefault();
        addKeyword(activeCatEditType, inp.dataset.cat, inp.value);
        inp.value = "";
      }
    });
  });
}

async function deleteCategory(type, cat){
  CATEGORIES[type] = (CATEGORIES[type] || []).filter(c => c !== cat);
  if (CATEGORY_KEYWORDS[type]) delete CATEGORY_KEYWORDS[type][cat];
  await saveCategories();
  await saveCategoryKeywords();
  if (type === currentType) populateCategorySelect();
  renderCategoryEditor();
}

async function addCategoryDirect(type, name){
  const trimmed = (name || "").trim();
  if (!trimmed) return;
  if (!CATEGORIES[type]) CATEGORIES[type] = [];
  if (CATEGORIES[type].includes(trimmed)) { renderCategoryEditor(); return; }
  CATEGORIES[type].push(trimmed);
  if (!CATEGORY_KEYWORDS[type]) CATEGORY_KEYWORDS[type] = {};
  CATEGORY_KEYWORDS[type][trimmed] = [];
  await saveCategories();
  await saveCategoryKeywords();
  if (type === currentType) populateCategorySelect();
  renderCategoryEditor();
}

async function addKeyword(type, cat, word){
  word = word.trim();
  if (!word) return;
  if (!CATEGORY_KEYWORDS[type][cat]) CATEGORY_KEYWORDS[type][cat] = [];
  if (!CATEGORY_KEYWORDS[type][cat].includes(word)) CATEGORY_KEYWORDS[type][cat].push(word);
  await saveCategoryKeywords();
  renderCategoryEditor();
}
async function removeKeyword(type, cat, word){
  CATEGORY_KEYWORDS[type][cat] = (CATEGORY_KEYWORDS[type][cat] || []).filter(w => w !== word);
  await saveCategoryKeywords();
  renderCategoryEditor();
}

/* ---------- 자동완성 ---------- */
function getFilteredRecent(){
  const q = $("fDesc").value.trim().toLowerCase();
  let items = recentDesc[currentType] || [];
  if (q) items = items.filter(d => d.toLowerCase().includes(q));
  return items.slice(0, 6);
}
function getKeywordSuggestions(query, excludeSet){
  if (!query) return [];
  const catMap = CATEGORY_KEYWORDS[currentType] || {};
  const seen = new Set();
  const result = [];
  Object.keys(catMap).forEach(cat => {
    (catMap[cat] || []).forEach(w => {
      const lw = w.toLowerCase();
      if (lw.includes(query) && !seen.has(lw) && !excludeSet.has(lw)){
        seen.add(lw);
        result.push({ word: w, cat });
      }
    });
  });
  return result.slice(0, 6);
}
function renderAutocomplete(){
  const box = $("acBox");
  const query = $("fDesc").value.trim().toLowerCase();
  const recentItems = getFilteredRecent();
  const recentSet = new Set(recentItems.map(d => d.toLowerCase()));
  const keywordItems = getKeywordSuggestions(query, recentSet);

  if (recentItems.length === 0 && keywordItems.length === 0){
    box.classList.remove("open");
    box.innerHTML = "";
    return;
  }

  let html = "";
  if (recentItems.length){
    html += `<div class="ac-label">최근 검색어</div>` + recentItems.map(d => {
      const cat = categorize(d, currentType);
      return `<div class="ac-item" data-value="${escapeAttr(d)}">
        <span>${escapeHtml(d)}</span><span class="ac-cat">${cat}</span>
      </div>`;
    }).join("");
  }
  if (keywordItems.length){
    html += `<div class="ac-label">카테고리 키워드</div>` + keywordItems.map(k => {
      return `<div class="ac-item" data-value="${escapeAttr(k.word)}">
        <span>${escapeHtml(k.word)}</span><span class="ac-cat">${escapeHtml(k.cat)}</span>
      </div>`;
    }).join("");
  }
  box.innerHTML = html;
  box.classList.add("open");
  box.querySelectorAll(".ac-item").forEach(el => {
    el.addEventListener("mousedown", (e) => {
      e.preventDefault();
      $("fDesc").value = el.dataset.value;
      categoryManuallySet = false;
      $("fCategory").value = categorize(el.dataset.value, currentType);
      box.classList.remove("open");
    });
  });
}
function closeAutocomplete(){ $("acBox").classList.remove("open"); }

/* ---------- 데이터 조작 ---------- */
async function addTx(){
  const date = toISO(formDate);
  const desc = $("fDesc").value.trim();
  const amount = Number($("fAmount").value);
  const category = $("fCategory").value;

  if (!date){ alert("날짜를 선택해주세요."); return; }
  if (!desc){ alert("사용처를 입력해주세요."); return; }
  if (!amount || amount <= 0){ alert("금액을 올바르게 입력해주세요."); return; }

  const proof = $("fProof").checked;

  const tx = { id: Date.now(), date, desc, amount, category, type: currentType, proof };
  transactions.push(tx);
  await saveTransactions();
  rememberDesc(desc);

  currentWeekStart = startOfWeek(new Date(date + "T00:00:00"));
  summaryMonthDate = new Date(date + "T00:00:00");
  $("fDesc").value = "";
  $("fAmount").value = "";
  $("fProof").checked = false;
  categoryManuallySet = false;
  $("fCategory").value = categorize("", currentType);
  closeAutocomplete();
  render();
}

async function updateCategory(id, category){
  const tx = transactions.find(t => t.id === id);
  if (tx){ tx.category = category; await saveTransactions(); render(); }
}

async function deleteTx(id){
  transactions = transactions.filter(t => t.id !== id);
  await saveTransactions();
  render();
}

/* ---------- 왼쪽: 기록/카테고리 탭 ---------- */
function switchLeftTab(tab){
  document.querySelectorAll(".left-tab-btn").forEach(b => b.classList.toggle("active", b.dataset.lefttab === tab));
  $("leftPanelRecord").classList.toggle("active", tab === "record");
  $("leftPanelCategory").classList.toggle("active", tab === "category");
  if (tab === "category") renderCategoryEditor();
}

function init(){
  renderDateDisplay();
  $("dateDisplayBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    if ($("datePopover").classList.contains("open")) closeFormCalendar();
    else openFormCalendar();
  });
  $("fdCalPrev").addEventListener("click", () => {
    fdCalViewDate.setMonth(fdCalViewDate.getMonth() - 1);
    renderFormCalendar();
  });
  $("fdCalNext").addEventListener("click", () => {
    fdCalViewDate.setMonth(fdCalViewDate.getMonth() + 1);
    renderFormCalendar();
  });
  document.addEventListener("click", (e) => {
    if (!$("dateSimple").contains(e.target)) closeFormCalendar();
  });

  $("btnExpense").addEventListener("click", () => setType("expense"));
  $("btnIncome").addEventListener("click", () => setType("income"));
  $("btnAdd").addEventListener("click", addTx);

  $("fDesc").addEventListener("input", () => {
    renderAutocomplete();
    if (!categoryManuallySet){
      $("fCategory").value = categorize($("fDesc").value, currentType);
    }
  });
  $("fDesc").addEventListener("focus", renderAutocomplete);
  $("fDesc").addEventListener("blur", () => setTimeout(closeAutocomplete, 120));

  $("fCategory").addEventListener("change", () => { categoryManuallySet = true; });

  $("fAmount").addEventListener("keydown", (e) => {
    if (e.key === "Enter"){
      e.preventDefault();
      addTx();
    }
  });

  function animateWeekChange(direction, applyChange){
    const grid = $("cvGrid");
    const dist = 34;
    const outX = direction === "next" ? -dist : dist;
    const inX = direction === "next" ? dist : -dist;
    grid.style.transition = "opacity .16s ease-in, transform .16s ease-in";
    grid.style.opacity = "0";
    grid.style.transform = `translateX(${outX}px) scale(0.97)`;
    setTimeout(() => {
      applyChange();
      grid.style.transition = "none";
      grid.style.transform = `translateX(${inX}px) scale(0.97)`;
      requestAnimationFrame(() => {
        grid.style.transition = "opacity .2s ease-out, transform .2s ease-out";
        grid.style.opacity = "1";
        grid.style.transform = "translateX(0) scale(1)";
      });
    }, 160);
  }

  function goPrevWeek(){
    if (weekBoundStatus().blockPrev) return;
    animateWeekChange("prev", () => {
      currentWeekStart.setDate(currentWeekStart.getDate() - 7);
      renderWeekSection();
    });
  }
  function goNextWeek(){
    if (weekBoundStatus().blockNext) return;
    animateWeekChange("next", () => {
      currentWeekStart.setDate(currentWeekStart.getDate() + 7);
      renderWeekSection();
    });
  }

  function weekOverlapsMonth(weekStart, monthDate){
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);
    const mStart = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
    const mEnd = new Date(monthDate.getFullYear(), monthDate.getMonth()+1, 0);
    return toISO(weekStart) <= toISO(mEnd) && toISO(weekEnd) >= toISO(mStart);
  }

  function onMonthChanged(direction){
    if (!weekOverlapsMonth(currentWeekStart, summaryMonthDate)){
      const mStart = new Date(summaryMonthDate.getFullYear(), summaryMonthDate.getMonth(), 1);
      const mEnd = new Date(summaryMonthDate.getFullYear(), summaryMonthDate.getMonth()+1, 0);
      const targetWeekStart = currentWeekStart > mEnd ? startOfWeek(mEnd) : startOfWeek(mStart);
      animateWeekChange(direction, () => {
        currentWeekStart = targetWeekStart;
        render();
      });
    } else {
      // 같은 주가 유지되는 경우 애니메이션 없이 바로 갱신
      render();
    }
  }

  $("prevMonth").addEventListener("click", () => {
    summaryMonthDate.setMonth(summaryMonthDate.getMonth() - 1);
    onMonthChanged("prev");
  });
  $("nextMonth").addEventListener("click", () => {
    summaryMonthDate.setMonth(summaryMonthDate.getMonth() + 1);
    onMonthChanged("next");
  });

  // 월별 그래프를 마우스로 드래그해서 좌우로 스크롤
  (function setupChartDrag(){
    const chart = $("moChart");
    let isDown = false;
    let startX = 0;
    let startScroll = 0;
    chart.addEventListener("pointerdown", (e) => {
      isDown = true;
      startX = e.clientX;
      startScroll = chart.scrollLeft;
      chart.setPointerCapture(e.pointerId);
    });
    chart.addEventListener("pointermove", (e) => {
      if (!isDown) return;
      chart.scrollLeft = startScroll - (e.clientX - startX);
    });
    chart.addEventListener("pointerup", () => { isDown = false; });
    chart.addEventListener("pointercancel", () => { isDown = false; });
  })();

  // 달력을 좌우로 드래그(마우스/터치)해서 한 주씩 넘기기
  (function setupSwipe(){
    const grid = $("cvGrid");
    let startX = null;
    let dragging = false;
    grid.addEventListener("pointerdown", (e) => {
      startX = e.clientX;
      dragging = true;
      grid.setPointerCapture(e.pointerId);
    });
    grid.addEventListener("pointerup", (e) => {
      if (!dragging) return;
      dragging = false;
      const dx = e.clientX - startX;
      const threshold = 40;
      if (dx > threshold){
        goPrevWeek();
      } else if (dx < -threshold){
        goNextWeek();
      } else {
        // 드래그가 아니라 탭/클릭으로 판단 -> 날짜 선택
        // pointer capture 상태에서는 e.target이 grid 자신이 되어버리므로 좌표 기준으로 실제 엘리먼트를 찾는다
        const realTarget = document.elementFromPoint(e.clientX, e.clientY);
        const cell = realTarget ? realTarget.closest(".cv-cell[data-iso]") : null;
        if (cell && !cell.classList.contains("out-of-month")){
          const [y,m,d] = cell.dataset.iso.split("-").map(Number);
          formDate = new Date(y, m-1, d);
          renderDateDisplay();
          $("fDesc").focus();
        }
      }
    });
    grid.addEventListener("pointercancel", () => { dragging = false; });
  })();

  document.querySelectorAll(".left-tab-btn").forEach(btn => {
    btn.addEventListener("click", () => switchLeftTab(btn.dataset.lefttab));
  });
  document.querySelectorAll("#catTypeToggle button").forEach(btn => {
    btn.addEventListener("click", () => {
      activeCatEditType = btn.dataset.ctype;
      document.querySelectorAll("#catTypeToggle button").forEach(b => b.classList.toggle("active", b === btn));
      renderCategoryEditor();
    });
  });
  $("modalCloseBtn").addEventListener("click", closeMonthModal);
  $("modalExportBtn").addEventListener("click", exportModalToExcel);
  $("btnOpenAllModal").addEventListener("click", openAllModal);
  $("monthModalOverlay").addEventListener("click", (e) => {
    if (e.target === $("monthModalOverlay")) closeMonthModal();
  });
  document.querySelectorAll("#modalTypeToggle button").forEach(btn => {
    btn.addEventListener("click", () => {
      modalTypeFilter = btn.dataset.mtype;
      document.querySelectorAll("#modalTypeToggle button").forEach(b => b.classList.toggle("active", b === btn));
      renderModalBreakdown();
      renderModalList();
    });
  });
  $("modalCatFilterBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    if ($("modalCatFilterPopover").classList.contains("open")) closeModalCatFilter();
    else openModalCatFilter();
  });
  document.addEventListener("click", (e) => {
    if (!$("modalCatFilterWrap").contains(e.target)) closeModalCatFilter();
  });
  document.querySelectorAll("#modalProofToggle button").forEach(btn => {
    btn.addEventListener("click", () => {
      modalProofFilter = btn.dataset.mproof;
      document.querySelectorAll("#modalProofToggle button").forEach(b => b.classList.toggle("active", b === btn));
      renderModalBreakdown();
      renderModalList();
    });
  });
  $("modalDateFromBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    if ($("modalDateFromPopover").classList.contains("open")) closeModalDatePopover();
    else openModalDatePopover("from");
  });
  $("modalDateToBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    if ($("modalDateToPopover").classList.contains("open")) closeModalDatePopover();
    else openModalDatePopover("to");
  });
  $("modalDateFromPrev").addEventListener("click", () => { modalFromCalView.setMonth(modalFromCalView.getMonth()-1); renderModalDateCal("from"); });
  $("modalDateFromNext").addEventListener("click", () => { modalFromCalView.setMonth(modalFromCalView.getMonth()+1); renderModalDateCal("from"); });
  $("modalDateToPrev").addEventListener("click", () => { modalToCalView.setMonth(modalToCalView.getMonth()-1); renderModalDateCal("to"); });
  $("modalDateToNext").addEventListener("click", () => { modalToCalView.setMonth(modalToCalView.getMonth()+1); renderModalDateCal("to"); });
  document.addEventListener("click", (e) => {
    if (!$("modalDateFromBtn").parentElement.contains(e.target) && !$("modalDateToBtn").parentElement.contains(e.target)){
      closeModalDatePopover();
    }
  });

  $("btnAddCategory").addEventListener("click", () => {
    const row = $("catAddRow");
    const willShow = (row.style.display === "none" || !row.style.display);
    row.style.display = willShow ? "block" : "none";
    if (willShow){
      $("newCategoryInput").value = "";
      $("newCategoryInput").focus();
    }
  });
  $("newCategoryInput").addEventListener("keydown", async (e) => {
    if (e.key === "Enter"){
      e.preventDefault();
      const name = $("newCategoryInput").value;
      await addCategoryDirect(activeCatEditType, name);
      $("newCategoryInput").value = "";
      $("catAddRow").style.display = "none";
    }
  });

  loadAll();
}

init();
</script>
