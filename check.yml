name: Mercari brand alert
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행도 가능
# seen.json 커밋을 위해 쓰기 권한 필요
permissions:
  contents: write
concurrency:
  group: mercari-alert
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # facets/ 폴더는 더 이상 여기서 매번 새로 받아오지 않는다.
      # 별도의 'Fetch Mercari facets' 워크플로우가 하루 1회 갱신해서
      # 리포에 커밋해둔 것을 checkout 단계에서 그대로 받아 쓴다.
      # (facets가 비어있거나 오래됐을 경우의 경고는 main.py의
      # load_facets()/resolve_* 쪽 로직이 이미 처리한다.)
      - name: Run checker
        timeout-minutes: 3
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
      - name: Commit updated seen.json
        run: |
          git config user.name "mercari-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "update seen items"
          # 야후옥션 워크플로우 등 다른 작업이 같은 브랜치에 동시에 push할 수 있으므로,
          # 실패하면 최신 커밋을 받아와서(rebase) 몇 번 재시도한다.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공"
              break
            fi
            echo "push 실패, origin/main 기준으로 rebase 후 재시도 ($i/5)"
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
