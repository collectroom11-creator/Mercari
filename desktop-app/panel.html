<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1E1D1B;
    color: #EDE9E1;
    overflow-y: auto;
  }
  #list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    padding: 10px;
  }
  .item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 6px;
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
    min-width: 0;
  }
  .item:hover { background: #29271F; }
  .thumb {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    border-radius: 8px;
    background: #14130F;
  }
  .info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 0 2px 2px;
  }
  .platform {
    font-size: 10px;
    color: #9C9484;
  }
  .platform img {
    height: 14px;
    width: auto;
    display: block;
  }
  .line {
    font-size: 12px;
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .brand { font-weight: 600; }
  .price { color: #B5AD9C; white-space: nowrap; }
  .empty {
    grid-column: 1 / -1;
    padding: 40px 20px;
    text-align: center;
    color: #776F5E;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div id="list"></div>
  <script src="panel.js"></script>
</body>
</html>
