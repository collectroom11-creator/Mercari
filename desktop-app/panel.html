<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1E1D1B;
    color: #EDE9E1;
    overflow-y: auto;
  }
  .item {
    display: flex;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid #333029;
    text-decoration: none;
    color: inherit;
  }
  .item:hover { background: #29271F; }
  .item img {
    display: block;
    width: 132px;
    height: 132px;
    object-fit: contain;
    border-radius: 8px;
    background: #14130F;
    flex: none;
  }
  .info {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }
  .platform {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #9C9484;
  }
  .platform img {
    height: 15px;
    width: auto;
    display: block;
  }
  .brand {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .price {
    font-size: 12px;
    color: #B5AD9C;
    white-space: pre-line;
  }
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: #776F5E;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div id="list"></div>
  <script src="panel.js"></script>
</body>
</html>
