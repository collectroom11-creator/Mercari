<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1E1D1B;
    color: #EDE9E1;
    padding: 14px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 12px;
    font-weight: 600;
    color: #B5AD9C;
  }
  .calc-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 8px;
    margin-bottom: 10px;
  }
  .calc-field {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 10px;
    color: #9C9484;
  }
  .calc-field-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .calc-mini-btn {
    border: 0;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 10px;
    font-weight: 600;
    background: #333029;
    color: #EDE9E1;
    cursor: default;
  }
  .calc-mini-btn:hover {
    background: #4A463C;
  }
  .calc-unit-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .calc-unit-wrap .calc-unit {
    position: absolute;
    right: 8px;
    font-size: 11px;
    color: #776F5E;
    pointer-events: none;
  }
  .calc-field input {
    width: 100%;
    background: #14130F;
    border: 1px solid #333029;
    border-radius: 6px;
    padding: 6px 26px 6px 8px;
    font-size: 12px;
    color: #EDE9E1;
    font-variant-numeric: tabular-nums;
  }
  .calc-field input:focus {
    outline: none;
    border-color: #B5AD9C;
  }
  .calc-result {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    background: #29271F;
    border-radius: 8px;
    padding: 10px 12px;
  }
  .calc-result-label {
    font-size: 11px;
    color: #9C9484;
  }
  .calc-result-value {
    font-size: 18px;
    font-weight: 600;
    color: #EDE9E1;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <h1>마진 계산기</h1>
  <div class="calc-grid">
    <div class="calc-field">
      <div class="calc-field-head">매입가<button type="button" id="calcCostDiscount" class="calc-mini-btn" title="지금 매입가에서 10% 빼기">-10%</button></div>
      <div class="calc-unit-wrap"><input type="number" id="calcCost" value="0" min="0" step="1"><span class="calc-unit">엔</span></div>
    </div>
    <label class="calc-field">수수료
      <div class="calc-unit-wrap"><input type="number" id="calcFee" value="300" min="0" step="1"><span class="calc-unit">엔</span></div>
    </label>
    <label class="calc-field">현지배송비
      <div class="calc-unit-wrap"><input type="number" id="calcDomestic" value="0" min="0" step="1"><span class="calc-unit">엔</span></div>
    </label>
    <label class="calc-field">국제배송비
      <div class="calc-unit-wrap"><input type="number" id="calcIntl" value="500" min="0" step="1"><span class="calc-unit">엔</span></div>
    </label>
    <label class="calc-field">환율(100엔)
      <div class="calc-unit-wrap"><input type="number" id="calcRate" value="901" min="0" step="0.1"><span class="calc-unit">원</span></div>
    </label>
    <label class="calc-field">마진율
      <div class="calc-unit-wrap"><input type="number" id="calcMargin" value="40" min="0" max="99" step="0.1"><span class="calc-unit">%</span></div>
    </label>
    <label class="calc-field">관세율
      <div class="calc-unit-wrap"><input type="number" id="calcDuty" value="13" min="0" step="0.1"><span class="calc-unit">%</span></div>
    </label>
    <label class="calc-field">부가세율
      <div class="calc-unit-wrap"><input type="number" id="calcVat" value="10" min="0" step="0.1"><span class="calc-unit">%</span></div>
    </label>
  </div>
  <div class="calc-result">
    <span class="calc-result-label">권장 판매가</span>
    <span class="calc-result-value" id="calcSell">-</span>
  </div>
  <script src="calc.js"></script>
</body>
</html>
